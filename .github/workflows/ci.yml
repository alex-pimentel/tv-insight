name: CI

# Mirrors the Jenkinsfile so the repository is verifiable on GitHub too: the same
# gates, in the same order, with the same quality bar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Tests
        run: |
          pytest \
            --junitxml=reports/pytest.xml \
            --cov=tv_insight \
            --cov-fail-under=90 \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: backend/reports/

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint (type-aware, fails on deprecated APIs)
        run: npm run lint

      - name: Component tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

  system:
    name: Containers and end to end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Compose config is valid
        run: docker compose config --quiet

      - name: Start the stack
        run: docker compose up --build -d

      - name: Wait for the application
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:7777/api/health >/dev/null; then
              echo "application is up"; exit 0
            fi
            sleep 2
          done
          docker compose logs app; exit 1

      - name: Schema matches the models
        run: docker compose exec -T app alembic -c /app/alembic.ini check

      - name: Smoke test against the public catalogue
        run: |
          count=$(curl -fsS "http://localhost:7777/api/series/search?q=breaking%20bad" | jq '.count')
          echo "catalogue results: $count"
          test "$count" -gt 0

      - name: Database integration tests
        run: |
          docker compose run --rm --no-deps --entrypoint sh \
            -v "$PWD/backend/tests:/app/tests" app -c \
            "pip install -q pytest pytest-asyncio && python -m pytest -q tests/integration/test_repositories.py"

      - name: End to end (Playwright)
        run: docker compose --profile test run --rm e2e

      - name: Application logs
        if: always()
        run: docker compose logs --no-color > compose.log

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-reports
          path: |
            compose.log
            frontend/playwright-report/
            frontend/test-results/

      - name: Tear down
        if: always()
        run: docker compose --profile test down -v
